<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Tickets</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header>
    <h1>My Tickets</h1>
</header>
<main>
    <ul>
        <li><a th:href="@{/upload}">Upload image</a></li>
        <li><a th:href="@{/tickets/create}">Create new ticket</a></li>
        <li><a th:href="@{/}">Home</a></li>
    </ul>

    <section th:object="${myTicket}">
        <h2>My Tickets</h2>
        <div th:if="${#lists.isEmpty(myTicket)}">
            <p>You have no tickets yet.</p>
        </div>
        <div th:each="tickets : ${myTicket}">
            <strong th:text="${tickets.title}"></strong>
            <span th:text="' — ' + ${tickets.status}"></span>
            <br>
            <em th:text="${tickets.description}"></em>
            <br>
            <a th:href="@{/tickets/{id}/edit(id=${tickets.id})}">Edit</a>
            <hr>
        </div>
    </section>
</main>
</body>
</html>
